# Native launch screen (generated by flutter_native_splash). Brand-colour
# background (DSColor.primary) + the logo — the in-app SplashWidget draws the same
# logo over the same colour on its first frame, so the hand-off shows no flash.
# Regenerate from `app/`, where the platform folders live:
# `cd app && dart run flutter_native_splash:create`.
#
# Points at the PNG master, not the bundled webp: the generator can only read PNG.
# It scales the source ÷4, so the 1024px master renders 256pt wide natively —
# and _SplashLogo._logoWidth is that same 1024/4, so the branded splash takes
# over at the size the OS was already drawing. Re-export the master at another
# size and that constant has to move with it.
#
# Note: the generator writes a white iOS LaunchScreen backgroundColor — after
# regenerating, re-set it to the brand colour (DSColor.primary, as red/green/blue
# floats) in app/ios/Runner/Base.lproj/LaunchScreen.storyboard.
# It also rewrites AndroidManifest.xml (dropping screenOrientation="portrait")
# and Info.plist (adding UIStatusBarHidden): discard both diffs.
flutter_native_splash:
  color: "#14172B"
  image: ../packages/dsm/assets/source/logo.png
  # Android 12+ draws its own splash and crops the image to a circle, which cuts
  # the logo's corner cubes. A transparent image leaves that splash a plain
  # colour, and the in-app splash draws the whole logo on its first frame.
  # Omitting `image` would not do: the system then shows the launcher icon.
  android_12:
    color: "#14172B"
    image: ../packages/dsm/assets/source/android12_splash_empty.png
  android: true
  ios: true
  web: false
