# Launcher icons (generated by flutter_launcher_icons). Run from `app/`, where
# the platform folders live: `cd app && dart run flutter_launcher_icons`.
#
# Two masters, both built from the logo by scripts/make_icon_masters.py, because
# the logo itself is none of the things an icon has to be: it is 1024x790 rather
# than square, and it is transparent.
#
#   icon.png            the logo on the brand colour (DSColor.primary), RGB with no
#                       alpha channel at all — the App Store rejects a 1024
#                       marketing icon that has one. The same ground as the
#                       launch screen, so icon and first frame are continuous.
#   icon_foreground.png the logo at 78% on transparency. Android crops an
#                       adaptive foreground to an inner circle of about 66%, so
#                       a full-bleed logo would lose its edges.
flutter_launcher_icons:
  image_path: "../packages/dsm/assets/source/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#14172B"
  adaptive_icon_foreground: "../packages/dsm/assets/source/icon_foreground.png"
