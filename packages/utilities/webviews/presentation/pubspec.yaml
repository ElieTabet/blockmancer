name: webviews_presentation
description: "The Webview widget — renders a webviews_domain WebViewConfiguration through flutter_inappwebview."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5   # The only webview engine; no feature package may depend on it directly
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.2
  timber: any
  webviews_domain: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  freezed: ^3.2.5
  riverpod_generator: 4.0.3
  mocktail: ^1.0.4
