name: keychain
description: "Generic secure on-device key/value storage (Keychain / Keystore). Knows nothing about tokens or auth."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  riverpod_generator: 4.0.3
  mocktail: ^1.0.4
