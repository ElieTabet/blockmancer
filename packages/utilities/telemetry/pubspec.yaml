name: telemetry
description: "Usage statistics and crash reports — Firebase Analytics and Crashlytics behind one switch, set by the app."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  riverpod_annotation: ^4.0.2
  shared_domain: any
  timber: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  # Test-only: ProviderContainer, for driving the launch step.
  flutter_riverpod: ^3.3.1
  riverpod_generator: 4.0.3
  mocktail: ^1.0.4
