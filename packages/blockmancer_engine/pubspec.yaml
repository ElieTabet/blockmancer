name: blockmancer_engine
description: "Blockmancer's game rules — the implementation of shared_domain's GameRules: pieces, scoring, jokers and the run state machine. Pure Dart: no Flutter, no clock, no I/O."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  freezed_annotation: ^3.1.0
  shared_domain: any

dev_dependencies:
  build_runner: 2.16.0
  freezed: ^3.2.5
  test: ^1.31.1
