name: assets
description: "Shared assets — images bundled and exposed as a type-safe FlutterGen Assets accessor."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.0
  flutter_gen_runner: ^5.15.0

flutter:
  assets:
    - assets/images/
    # Joker art, by JokerId name; optional, file by file (see README.md there).
    - assets/jokers/

flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      package_parameter_enabled: true
