name: app_providers
description: "Composition — aggregates cross-feature provider overrides for the app's root ProviderContainer."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ads: any
  app_router: any
  blockmancer_engine: any
  push: any
  push_notifications_domain: any
  push_notifications_presentation: any
  telemetry: any
  game_data: any
  game_domain: any
  game_presentation: any
  home_presentation: any
  riverpod_annotation: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_riverpod: ^3.3.1     # ProviderContainer, for the composition wiring test
  shared_domain: any           # the engine's RunState, for the daily-seed test
