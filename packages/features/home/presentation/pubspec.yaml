name: home_presentation
description: "home presentation layer — the first tab: the world map under today's daily run, with practice a tap away. Where a choice leads, the worlds, the progression and the bests come through slots."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  design_system: any
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  l10n_application: any
  riverpod_annotation: ^4.0.2
  shared_domain: any
  timber: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.4.0
  build_runner: 2.16.0
  riverpod_generator: 4.0.3
