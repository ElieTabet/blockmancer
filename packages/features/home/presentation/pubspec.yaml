name: home_presentation
description: "home presentation layer — the first tab: the shared header over a placeholder, and the moment to ask about notifications."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  design_system: any
  l10n_application: any
  screen_header: any
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.0
  riverpod_generator: 4.0.3
  auto_route_generator: ^10.4.0
  mocktail: ^1.0.4
  # Test-only: the page mounts screen_header's session control, whose logout
  # slot answers a Result.
  result: any
