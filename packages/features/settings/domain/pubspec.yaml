name: settings_domain
description: "settings domain layer — the player's settings (sound, haptics, reduce motion, language, whether the tutorial was seen) the reset of their progress, and the feedback email. Where they are kept, what progress is, the app's version and the mail app come through slots."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.2
  timber: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: ProviderContainer, for reading the settings back across containers.
  flutter_riverpod: ^3.3.1
  build_runner: 2.16.0
  freezed: ^3.2.5
  riverpod_generator: 4.0.3
