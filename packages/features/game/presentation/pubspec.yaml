name: game_presentation
description: "game presentation layer — the board, the tray and the joker picks of a run. Its rules, best scores and revive reward come through game_domain's slots; this layer only draws them and forwards moves."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  design_system: any
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  game_domain: any
  intl: ^0.20.2
  l10n_application: any
  riverpod_annotation: ^4.0.2
  shared_domain: any
  timber: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.4.0
  build_runner: 2.16.0
  freezed: ^3.2.5
  riverpod_generator: 4.0.3
