name: blockmancer_workspace
description: "Foundation monorepo workspace root. Declares the workspace packages — no app dependencies live here."
publish_to: none

environment:
  sdk: ^3.11.0 # >=3.11.0 <4.0.0
  flutter: ^3.44.0 # >=3.44.0 <4.0.0

workspace:
  - app
  - packages/*
  - packages/dsm/*
  - packages/dsm/l10n/*
  - packages/composition/*
  - packages/plugins/*
  - packages/utilities/*
  - packages/utilities/**/* # layer-split utilities (webviews/{domain,presentation}) sit one level deeper
  - packages/features/**/*

# Root-only tooling: this runs at the workspace root, so it is declared here as well as
# under melos.command.bootstrap below (the single source of versions — keep the two in step).
dev_dependencies:
  melos: ^7.5.0 # Monorepo script orchestration: test, generate, analyze across all packages

# Forces the analyzer 10.2.0 line so the custom_lints analyzer-plugin
# (analysis_server_plugin, which the Dart SDK's plugin host requires at >=0.3.8 →
# analyzer >=10.0.2) can coexist with the codegen stack. Mirrors flutter-front.
dependency_overrides:
  analyzer: 10.2.0 # overrides riverpod_generator 4.0.3's ^9.0.0 upper bound
  dart_style: 3.1.7 # 3.1.8+ requires analyzer >=13; 3.1.7 supports analyzer >=10 <12
  riverpod_analyzer_utils: 1.0.0-dev.10 # riverpod_generator 4.0.3 pins dev.9, which mis-parses under analyzer 10; dev.10 handles it
  mockito: 5.6.4 # transitive via riverpod_generator; 5.6.5+ requires analyzer >=13

melos:
  # Single source of dependency versions for the whole workspace. `melos bootstrap`
  # stamps each version down into the packages that declare the dependency: external
  # (hosted) deps carry the version, internal/workspace deps stay version-less (`any`).
  # Add a new external dependency's version HERE, then declare it (version-less) in the
  # consuming package — never hand-manage a package-level version.
  command:
    bootstrap:
      environment:
        sdk: ">=3.11.0 <4.0.0"
        flutter: ">=3.44.0 <4.0.0"
      dependencies:
        analysis_server_plugin: 0.3.10 # pinned: newer versions require analyzer >=11 (see dependency_overrides)
        analyzer: ^10.2.0
        analyzer_plugin: 0.14.4 # pinned to match analyzer 10.2.0 / analysis_server_plugin 0.3.10
        auto_route: ^11.1.0
        device_info_plus: ^13.3.0 # the phone's model and OS version for a feedback email; known only to the app_info package
        dio: ^5.4.0 # not used today; `melos run create --type core` scaffolds packages with it
        firebase_analytics: ^12.6.0 # automatic usage events, production release builds only (packages/utilities/telemetry)
        firebase_core: ^4.15.0 # Firebase app initialization — the app starts it at boot; packages/utilities/push uses it in tests
        firebase_crashlytics: ^5.4.0 # crash reports, production release builds only (packages/utilities/telemetry)
        firebase_messaging: ^16.7.0 # FCM token + message streams (packages/utilities/push)
        firebase_remote_config: ^6.7.0 # live tuning: RunConfig, ad caps, the review cooldown and the update versions (packages/utilities/remote_config); 7.x needs firebase_core 5
        flutter_inappwebview: ^6.1.5 # The only webview engine; no feature depends on it directly (packages/utilities/webviews)
        flutter_local_notifications: ^22.3.1 # Android has no foreground display of its own — this is what draws it (packages/utilities/push)
        flutter_timezone: ^5.1.1 # the device's time zone name, for the daily reminder; known only to packages/utilities/push
        flutter_riverpod: ^3.3.1
        flutter_soloud: ^5.2.1 # sound effects preloaded in memory and mixed natively over FFI: no per-play channel hop or decode, so a sound lands with the touch (packages/utilities/sounds)
        freezed_annotation: ^3.1.0
        games_services: ^5.3.0 # Game Center and Play Games leaderboards; known only to packages/utilities/leaderboards
        google_fonts: ^6.3.1
        google_mobile_ads: ^9.1.0 # AdMob ads and Google's UMP consent form (which also presents the iOS ATT alert after its IDFA explainer); known only to packages/utilities/ads
        in_app_review: ^2.0.12 # the stores' own rating prompt and the store page; known only to packages/utilities/store_review
        in_app_purchase: ^3.3.1 # the Remove ads purchase, App Store and Google Play; known only to packages/utilities/purchases
        intl: ^0.20.2
        json_annotation: ^4.9.0
        package_info_plus: ^10.2.2 # the app's version and build number shown in Settings; known only to the app_info package
        pub_semver: ^2.2.1 # compares the app's version with Remote Config's minimum and latest (packages/features/app_update/domain)
        riverpod_annotation: ^4.0.2
        share_plus: ^13.3.1 # the OS share sheet, for Settings' Share test stats; known only to the external_links package
        shared_preferences: ^2.5.3 # the best scores, the saved run, the settings and the testers' play stats, on the device (packages/features/{game,settings}/data, packages/utilities/play_stats)
        slang: ^4.19.0
        slang_flutter: ^4.19.0
        timezone: ^0.11.2 # zoned dates for the daily reminder's local time; known only to packages/utilities/push
        url_launcher: ^6.3.2 # opens a link outside the app; known only to the external_links package
      dev_dependencies:
        auto_route_generator: ^10.4.0
        fake_async: ^1.3.3 # already flutter_test's: time a test controls, never the machine's
        build_runner: 2.16.0 # pinned: 2.16.2 calls AnalysisOptionsBuilder, absent in the pinned analyzer 10.2.0
        flutter_launcher_icons: ^0.14.4 # Generates the launcher icons into app/android and app/ios
        flutter_gen_runner: ^5.15.0 # FlutterGen — generates the type-safe Assets accessor (assets package)
        flutter_lints: ^6.0.0
        flutter_native_splash: ^2.4.8 # Generates the native Android/iOS launch screens (run from app/, where the platform folders live)
        freezed: ^3.2.5
        json_serializable: ^6.9.4
        mocktail: ^1.0.4
        package_info_plus: ^10.2.2 # also under dependencies: Melos stamps dev deps only from here, and composition's tests fake the version through it
        riverpod_generator: 4.0.3 # pinned: 4.0.4+ calls FormalParameter.type, absent in the pinned analyzer 10.2.0
        shared_preferences: ^2.5.3 # also under dependencies: composition's tests check what a release build deletes from the phone
        test: ^1.31.1 # runs the pure-Dart packages' suites (blockmancer_engine on the VM and in Chrome, ads), where flutter_test can't
        url_launcher_platform_interface: ^2.3.2 # fakes the launcher platform so external_links' catches are testable off-device

  scripts:
    prepare:
      description: Bootstrap workspace, link local packages, then run code generation
      steps:
        - bootstrap
        - generate

    generate:
      description: Generate all code — slang localization (CLI) first, then build_runner (freezed, json_serializable, auto_route, riverpod)
      steps:
        - generate-i18n
        - generate-build-runner

    generate-i18n:
      description: Generate slang localization sources (strings.g.dart) via the slang CLI, for packages that depend on slang
      run: dart run slang
      exec:
        concurrency: 1
        packageFilters:
          dependsOn: slang

    generate-build-runner:
      description: Run build_runner (freezed, json_serializable, auto_route, riverpod) across packages that declare it
      run: dart run build_runner build
      exec:
        concurrency: 1
        packageFilters:
          dependsOn: build_runner

    test:
      description: Run tests across all packages that contain test files — `dart test` for pure-Dart packages, `flutter test` otherwise
      run: melos exec -c 4 -- bash "$MELOS_ROOT_PATH/scripts/test_package.sh"

    balance-bot:
      description: Play 2,000 seeded runs per reference build with the greedy balance bot in Rubble and print how far they get, with the 50th and 80th percentile totals (packages/blockmancer_engine/tool/balance_bot.dart; for --runs / --build / --world, run it from that package)
      run: cd packages/blockmancer_engine && dart run tool/balance_bot.dart

    test-engine-web:
      description: Run the engine's suite compiled to JavaScript in Chrome — the PRNG must give the same numbers there as on the VM (needs Chrome installed)
      run: cd packages/blockmancer_engine && dart test -p chrome

    analyze:
      description: Run dart analyze across all packages — enforces layer boundary lint rules
      run: dart analyze --fatal-infos
      exec:
        concurrency: 4

    check-strings:
      description: "Fail on a hard-coded user-facing string in a presentation, composition or app source — copy goes through slang (scripts/check_hardcoded_strings.sh; `// l10n-ignore: <reason>` marks genuine non-copy)"
      run: bash scripts/check_hardcoded_strings.sh

    pr-check:
      description: |
        Full PR validation suite (delegates to scripts/pr_check.sh): format, hard-coded
        strings, analyze, cycling dependencies, generated up-to-date, tests. Stops on first failure.
        Prefer `bash scripts/pr_check.sh [--tests-only] [--verbose]`.
        Env: PRCHECK_VERBOSE=1 (print step output even on success), PRCHECK_TESTS_ONLY=1.
      run: bash scripts/pr_check.sh

    create:
      description: "Scaffold a new package — usage: melos run create -- --name <name> --type <feature|core|shared_domain|design_system>"
      run: bash scripts/create_package.sh

    flavor-dev:
      description: Run a dev build (ENV=dev — no telemetry)
      run: cd app && flutter run --dart-define-from-file=env/dev.json

    flavor-prod:
      description: Run a production build (ENV=prod — telemetry on in release mode)
      run: cd app && flutter run --dart-define-from-file=env/prod.json

    build-ios:
      description: |
        Release build of the iOS app against production, as an obfuscated .ipa
        for TestFlight, with its Dart symbols uploaded to Crashlytics
        (delegates to scripts/build_ios_release.sh). Cleans first, so it is
        built from nothing rather than from whatever debug runs left behind —
        the one place a clean is warranted. Requires macOS + Xcode.
      run: bash scripts/build_ios_release.sh

    build-android:
      description: |
        Release build of the Android app against production, as an obfuscated
        .aab for the Play Console, with its Dart symbols uploaded to
        Crashlytics (delegates to scripts/build_android_release.sh). Cleans
        first, like build-ios. Needs app/android/key.properties.
      run: bash scripts/build_android_release.sh
    build-ios-test:
      description: |
        The iOS release build as a test build for TestFlight: TEST_TOOLS on
        (Share test stats, Test crash, Google's test ad units), placeholders
        in app/env/prod.json only warn.
      run: bash scripts/build_ios_release.sh --test-tools
    build-android-test:
      description: |
        The Android release build as a test build for Play internal testing:
        TEST_TOOLS on, like build-ios-test.
      run: bash scripts/build_android_release.sh --test-tools

    build:
      description: |
        Interactive build against production: asks for the platform (Android,
        iOS or both), whether it is a release (the store build, exactly
        build-android / build-ios), a test build (build-android-test /
        build-ios-test) or an installable one (an APK / ad-hoc .ipa to share)
        and for the version, written to app/pubspec.yaml, and copies
        the artefacts to build/outputs/ (delegates to scripts/build.sh).
      run: bash scripts/build.sh
